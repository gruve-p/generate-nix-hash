name: "build-test"
on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nix
        uses: cachix/install-nix-action@v26

      - name: Run generate-nix-hash action
        uses: ./
        with:
          rev: v29.0 # initial commit
          owner: Groestlcoin
          repo: groestlcoin
          file: config.json

      - name: Verify results
        run: |
          cat > expected.json <<EOF
          {
            "rev": "v29.0",
            "sha256": "17b83jch717d91srw1yc93p8ndl894ld9gx916wyy6jis07px6xh"
          }
          EOF

          diff config.json expected.json
